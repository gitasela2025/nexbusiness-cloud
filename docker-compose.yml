version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: nexbusiness-mysql
    restart: always
    environment:
      MYSQL_DATABASE: nexbusiness_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend-app:
    build: ./backend
    container_name: nexbusiness-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/nexbusiness_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
    depends_on:
      - mysql-db

volumes:
  mysql_data:
