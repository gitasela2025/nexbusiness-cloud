services:
  mysql-db:
    image: mysql:8.0
    container_name: nexbusiness-mysql
    restart: always
    environment:
      MYSQL_DATABASE: nexbusiness_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-app:
    build: ./backend
    container_name: nexbusiness-backend
    restart: always
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/nexbusiness_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      mysql-db:
        condition: service_healthy

volumes:
  mysql_data:
