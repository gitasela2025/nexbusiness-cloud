# Spring Datasource (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/nexbusiness_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=8080

# Groq API Configuration (Replace with your actual Groq API Key)
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
jwt.secret=${JWT_SECRET}
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
