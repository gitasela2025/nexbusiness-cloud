# Spring Datasource (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/nexbusiness_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=8080

# Groq API Configuration (Replace with your actual Groq API Key)
groq.api.key=gsk_your_actual_groq_api_key_here
groq.api.url=https://api.groq.com/openai/v1/chat/completions
